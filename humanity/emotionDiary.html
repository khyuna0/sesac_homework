<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>감정일기장</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 30px;
        background-color: #f5f5f5;
        color: #222222;
      }

      .mainPage {
        margin: 0 auto;
        width: 1100px;
      }

      /* 헤더 */
      .header {
        position: sticky;
        top: 0;
        z-index: 100; /* 다른 요소 위에 뜨도록 설정 */
        background-color: white;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid black;
      }

      .diaryList {
        min-height: 300px;
        border: 1px solid black;
        padding: 10px;
      }
      .diary-card {
        border: 1px solid #ccc;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .diary-card:hover {
        background-color: #f9f9f9;
      }

      /* 상단 이동 플로팅 버튼 */
      .floatingBtn {
        position: fixed;
        right: 30px;
        bottom: 30px;
        width: 50px;
        height: 50px;
        background-color: #ff4d4f;
        color: white;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }

      /* 모달 스타일 */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        margin: 0;
      }
      .modal-content {
        background-color: #fff;
        padding: 20px;
        border-radius: 12px;
        width: 360px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
      }
      .modal-content input,
      .modal-content select,
      .modal-content textarea {
        margin: 0;
        padding: 8px;
        width: 100%;
      }
      .modal-content textarea {
        height: 100px;
        resize: none;
      }
      .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="mainPage">
      <!-- 헤더  -->
      <header class="header">
        <h1>감정일기장</h1>
        <button id="openModalBtn">+ 일기쓰기</button>
      </header>

      <!-- 일기 목록 영역 -->
      <h2>일기 목록</h2>
      <div class="diaryList" id="diaryList"></div>

      <!-- 플로팅 버튼 (위로 가기) -->
      <button class="floatingBtn" id="scrollTopBtn">TOP</button>

      <!-- 일기 작성 모달 -->
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
          <h2>일기 작성</h2>
          <input type="text" id="diaryTitle" placeholder="제목을 입력하세요" />
          <select id="diaryEmotion">
            <option value="행복해요">행복해요</option>
            <option value="슬퍼요">슬퍼요</option>
            <option value="놀랐어요">놀랐어요</option>
            <option value="화났어요">화났어요</option>
          </select>
          <textarea
            id="diaryContent"
            placeholder="오늘의 일기를 남겨보세요"
          ></textarea>
          <div class="modal-buttons">
            <button id="cancelBtn">취소</button>
            <button id="saveBtn">저장</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      // 저장된 일기 데이터 가져오기
      let diaryList = JSON.parse(localStorage.getItem("diaryList")) || [];

      const diaryContainer = document.getElementById("diaryList");
      const openModalBtn = document.getElementById("openModalBtn");
      const closeModalBtn = document.getElementById("cancelBtn");
      const saveBtn = document.getElementById("saveBtn");
      const modalOverlay = document.getElementById("modalOverlay");
      const scrollTopBtn = document.getElementById("scrollTopBtn");

      // 일기 목록 출력
      function renderDiaries() {
        if (diaryList.length === 0) {
          diaryContainer.innerHTML = "<p>작성된 일기가 없습니다.</p>";
          return;
        }

        diaryContainer.innerHTML = diaryList
          .map(
            (item) => `
            <div class="diary-card">
              <div onclick="goDetail(${item.id})">
                <h3>[${item.emotion}] ${item.title}</h3>
                <small>${item.date}</small>
                <p>댓글 ${item.comments ? item.comments.length : 0}개</p>
              </div>
              <button onclick="deleteDiary(${item.id})">삭제</button>
            </div>
          `,
          )
          .join("");
      }

      // 일기 저장
      function saveDiary() {
        const title = document.getElementById("diaryTitle").value.trim();
        const emotion = document.getElementById("diaryEmotion").value;
        const content = document.getElementById("diaryContent").value.trim();

        if (!title || !content) {
          alert("제목과 내용을 모두 입력해 주세요!");
          return;
        }

        const newDiary = {
          id: Date.now(),
          title: title,
          emotion: emotion,
          content: content,
          date: new Date().toLocaleDateString("ko-KR"),
          comments: [],
        };

        diaryList.unshift(newDiary);
        localStorage.setItem("diaryList", JSON.stringify(diaryList));

        closeModal();
        renderDiaries();
      }

      // 일기 삭제
      function deleteDiary(targetId) {
        diaryList = diaryList.filter((item) => item.id !== targetId);
        localStorage.setItem("diaryList", JSON.stringify(diaryList));
        renderDiaries();
      }

      // 상세 페이지 이동
      function goDetail(targetId) {
        location.href = `emotionDiaryDetail.html?id=${targetId}`;
      }

      // 모달 열기/닫기
      function openModal() {
        modalOverlay.style.display = "flex";
      }
      function closeModal() {
        modalOverlay.style.display = "none";
        document.getElementById("diaryTitle").value = "";
        document.getElementById("diaryContent").value = "";
      }

      // 위로가기
      function scrollToTop() {
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }

      // 이벤트 리스너 연결
      openModalBtn.addEventListener("click", openModal);
      closeModalBtn.addEventListener("click", closeModal);
      saveBtn.addEventListener("click", saveDiary);
      scrollTopBtn.addEventListener("click", scrollToTop);

      // 초기 실행
      renderDiaries();
    </script>
  </body>
</html>
